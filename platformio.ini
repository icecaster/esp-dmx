; Athom Ethernet WLED ESP32 DMX Controller
; Hardware: https://www.athom.tech/blank-1/ethernet-wled-esp32-addressable-dmx-led-strip-controller
; Chip: ESP32-WROOM-32E, Ethernet: LAN8720A, DMX: MAX485

[env:athom-dmx-esp32]
; arduino-esp32 v2.x (IDF 4.4) — required by esp_dmx v4.x
platform = espressif32 @ ~6.9.0
board = esp32dev
framework = arduino

board_build.flash_mode = dio
board_build.flash_frequency = 80000000
board_upload.flash_size = 4MB

monitor_speed = 115200
upload_speed = 921600

; Partition scheme with more app space (no OTA) or use default with OTA
board_build.partitions = min_spiffs.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Ethernet LAN8720A
    -DETH_PHY_TYPE=ETH_PHY_LAN8720
    -DETH_PHY_ADDR=1
    -DETH_PHY_MDC=23
    -DETH_PHY_MDIO=18
    -DETH_PHY_POWER=-1
    -DETH_CLK_MODE=ETH_CLOCK_GPIO17_OUT

lib_deps =
    someweisguy/esp_dmx @ ^4.1.0
    fastled/FastLED @ ^3.9.0
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
